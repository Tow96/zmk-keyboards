# Base config
CONFIG_ZMK_KEYBOARD_NAME="Tow's Corne"
CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
## windows battery level
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
## Improves compatibility with iPad
# CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_WIDGET_WPM_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Sleep
CONFIG_ZMK_SLEEP=y
## (5*60*1000)
CONFIG_ZMK_IDLE_TIMEOUT=300000
## (15*60*1000)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Eager debouncing
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
